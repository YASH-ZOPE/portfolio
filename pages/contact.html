<div class="sheet-paper grid-paper">
  <div class="page-body-spread">
    <!-- Left Side: Header & info -->
    <div class="page-side left-side-contact">
      <div class="notebook-header-line">
        <span class="header-vintage font-mono text-faded">DISPATCH TRANSMITTAL // VOL. 03</span>
      </div>

      <div class="contact-title-block">
        <h2 class="contact-main-title font-hand">LET'S<br>CONNECT</h2>
        <p class="contact-sub font-book">
          Have a project in mind or just want to say hi? I'd love to hear from you!
        </p>
      </div>

      <!-- Small envelope doodle and sun -->
      <div class="contact-sketch-container">
        <svg viewBox="0 0 100 60" class="doodle-contact-svg">
          <rect x="25" y="15" width="50" height="30" rx="2" fill="none" stroke="currentColor" stroke-width="1"/>
          <path d="M25 15l25 18 25-18" fill="none" stroke="currentColor" stroke-width="1"/>
          <!-- Sun sketch -->
          <circle cx="85" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="0.8"/>
          <line x1="85" y1="8" x2="85" y2="5" stroke="currentColor" stroke-width="0.8"/>
          <line x1="85" y1="22" x2="85" y2="25" stroke="currentColor" stroke-width="0.8"/>
          <line x1="78" y1="15" x2="75" y2="15" stroke="currentColor" stroke-width="0.8"/>
          <line x1="92" y1="15" x2="95" y2="15" stroke="currentColor" stroke-width="0.8"/>
        </svg>
      </div>

      <!-- Ideas collaboration note (yellow sticky) shifted to left side vacant space -->
      <div class="pinned-note sticky-ideas-note" style="transform: rotate(-3.5deg);">
        <p class="pinned-note-text font-hand">
          IDEAS<br>COLLABORATION<br>IMPACT
        </p>
        <span class="doodle-star">★</span>
      </div>

      <div class="botanical-decoration botanical-contact-left"></div>
    </div>

    <!-- Right Side: The physical wax seal envelope -->
    <div class="page-side right-side-contact envelope-interactive-side">
      
      <!-- ENVELOPE MODULE -->
      <div class="envelope-outer-container">
        <div class="envelope" id="contact-envelope" onclick="openEnvelope()">
          
          <!-- Back fold (acts as sleeve background) -->
          <div class="envelope-back"></div>
          
          <!-- The Letter (slides out from inside sleeve) -->
          <div class="envelope-letter" id="envelope-letter">
            <div class="letter-paper grid-paper">
              <span class="letter-label font-mono">EMAIL</span>
              
              <div class="letter-email-row">
                <svg class="letter-mail-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                <a href="mailto:zopeyash66w@gmail.com" class="letter-email font-mono">zopeyash66w@gmail.com</a>
              </div>
              
              <p class="letter-message font-hand">
                Let's build something great together! <span style="color:#a83f39">♥</span>
              </p>
            </div>
          </div>

          <!-- Left and right fold wings -->
          <div class="envelope-left-wing"></div>
          <div class="envelope-right-wing"></div>
          
          <!-- Bottom fold wing -->
          <div class="envelope-bottom-wing"></div>
          
          <!-- Top flap fold -->
          <div class="envelope-top-flap" id="envelope-flap"></div>
          
          <!-- WAX SEAL -->
          <div class="wax-seal" id="wax-seal">
            <div class="wax-seal-text">YZ</div>
          </div>

          <!-- Stamped Label -->
          <div class="stamp-open-me font-stamp">OPEN ME</div>
        </div>
      </div>



      <!-- Coffee Mug top-down physical mockup placement -->
      <div class="coffee-cup-container">
        <div class="coffee-cup-coaster"></div>
        <div class="coffee-cup">
          <div class="coffee-cup-rotator" id="coffee-cup-rotator">
            <div class="coffee-cup-handle"></div>
            <div class="coffee-liquid">
              <!-- coffee bubble details -->
              <div class="coffee-bubble cb-1"></div>
              <div class="coffee-bubble cb-2"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Dried botanical stem laying next to mug -->
      <div class="dried-flower-lay"></div>
    </div>
  </div>
</div>
